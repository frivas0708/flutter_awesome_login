name: awesome_login
description: A customizable and animated Flutter authentication card with login, registration, password recovery, 2FA, biometric auth, and custom onboarding support.
version: 1.0.3
homepage: https://github.com/frivas0708/flutter_awesome_login
repository: https://github.com/frivas0708/flutter_awesome_login
issue_tracker: https://github.com/frivas0708/flutter_awesome_login/issues

topics:
  - authentication
  - login
  - biometrics
  - ui
  - 2fa

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.2.0
  local_auth: ^2.1.7
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
